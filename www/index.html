<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hesaplar</title>
<meta name="theme-color" content="#2f6f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hesaplar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./app-icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1f2a24;--mut:#6b756e;--line:#e3ddd0;--a1:#2f6f4f;--a2:#2b6cb0;--a3:#b7791f;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191a;--card:#1e2426;--ink:#eef2ef;--mut:#9aa6a0;--line:#2c3437;--a1:#5fbf8f;--a2:#6aa7e8;--a3:#e0b04f}}
:root[data-theme="dark"]{--bg:#15191a;--card:#1e2426;--ink:#eef2ef;--mut:#9aa6a0;--line:#2c3437;--a1:#5fbf8f;--a2:#6aa7e8;--a3:#e0b04f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;margin:0 0 6px}
p.sub{color:var(--mut);margin:0 0 24px;font-size:15px}
.view{display:none}.view.on{display:block}
.card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;color:var(--ink);font:inherit;cursor:pointer}
.card:active{transform:scale(.985)}
.ic{flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 16%,transparent)}
.card b{display:block;font-size:18px}
.card span.d{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.arr{margin-left:auto;color:var(--mut);font-size:22px}
.back{background:none;border:0;color:var(--mut);font:inherit;font-size:15px;padding:6px 0;margin-bottom:14px;cursor:pointer}
.sm{width:100%;border-collapse:separate;border-spacing:0;margin:-4px 0 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.sm td{padding:9px 14px;border-top:1px solid var(--line)}
.sm tr:first-child td{border-top:0}
.sm td:first-child{color:var(--mut)}
.sm td.n{text-align:right;font-weight:600}
body{background:var(--bg) linear-gradient(180deg,color-mix(in srgb,var(--a1) 8%,transparent),transparent 300px) no-repeat;-webkit-font-smoothing:antialiased}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
p.sub{font-size:15px;margin-bottom:26px}
.card{position:relative;box-shadow:0 1px 2px rgba(20,30,25,.05),0 10px 26px -14px rgba(20,30,25,.28);transition:transform .15s ease,box-shadow .15s ease}
.card .ic{border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,transparent),color-mix(in srgb,var(--c) 7%,transparent))}
.card b{letter-spacing:-.01em}
.card[data-app]{margin-bottom:0;border-radius:20px 20px 0 0;border-bottom:0;border-top:3px solid var(--c);padding:16px 18px}
.sm{margin:0 0 22px;border-radius:0 0 20px 20px;box-shadow:0 10px 26px -14px rgba(20,30,25,.28)}
.sm td{padding:11px 18px;font-variant-numeric:tabular-nums}
.sm td:first-child{font-size:13px;letter-spacing:.01em}
.sm td.n{font-size:15px}
.sm tr.hl td{background:color-mix(in srgb,var(--c) 10%,transparent)}
.sm tr.hl td.n{color:var(--c);font-size:18px;font-weight:700}
#s-veresiye{--c:var(--a2)}#s-sut{--c:var(--a1)}#s-yem{--c:var(--a3)}
.back{background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:8px 16px;margin-bottom:18px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view.on>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.view.on>*:nth-child(n+4){animation-delay:.08s}
.view.on>*:nth-child(n+6){animation-delay:.16s}
.view.on>*:nth-child(n+8){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){.view.on>*{animation:none}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kp{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;padding:11px 10px;box-shadow:0 8px 20px -14px rgba(20,30,25,.3);min-width:0}
.kp{cursor:pointer;transition:transform .15s ease}.kp:active{transform:scale(.97)}
.kp small{display:block;color:var(--mut);font-size:11px;letter-spacing:.02em;margin-bottom:4px}
.kp b{display:block;font-size:15px;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#alerts{margin-bottom:16px}
.al{background:color-mix(in srgb,var(--a3) 14%,transparent);border:1px solid color-mix(in srgb,var(--a3) 35%,transparent);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:6px}
.sm td.viz{padding:12px 18px;border-top:1px solid var(--line)}
.sm td.up{color:#c0392b}.sm td.dn{color:#2f8f5b}
.spark{display:flex;align-items:flex-end;gap:3px;height:46px}
.spark i{flex:1;display:block;background:color-mix(in srgb,var(--c) 32%,transparent);border-radius:3px 3px 0 0}
.spark i:last-child{background:var(--c)}
.cap{color:var(--mut);font-size:11px;margin-top:6px}
.pb{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--line)}
.pb i{display:block;height:100%;background:var(--c)}
.pb i.b{background:color-mix(in srgb,var(--c) 28%,transparent)}
.lg{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:6px}
#gear{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;box-shadow:0 6px 16px -8px rgba(0,0,0,.3)}
.h2{font-size:15px;margin:6px 2px 10px;color:var(--mut);letter-spacing:.03em;text-transform:uppercase}
.sm.fin{border-radius:20px;border-top:3px solid var(--a1)}
.sm td.subh{padding:8px 18px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);background:color-mix(in srgb,var(--c) 6%,transparent)}
.al{cursor:pointer}
.pbt{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:600;font-size:15px;background:var(--a1);color:#fff;cursor:pointer;margin-top:10px}
.pbt.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.pbt:disabled{opacity:.6}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden],#lock[hidden]{display:none}
.sh{width:100%;max-width:520px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.shh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:18px}
.shh button{border:0;background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;border-radius:9px;padding:9px;background:none;color:var(--mut);font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--a1);color:#fff}
.fl{display:block;margin-bottom:10px}
.fl span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.fl input,#lpw{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.msg{min-height:18px;font-size:13px;color:#c0392b;margin-top:8px}
.msg.ok{color:#2f8f5b}
#lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lk{width:100%;max-width:340px;text-align:center}
select,.usr{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.usr{margin:4px 0 10px}
.chc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.chc h3{margin:0 0 12px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.vb{display:flex;align-items:flex-end;gap:10px;height:140px}
.vb .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.vb .c i{display:block;width:100%;max-width:46px;border-radius:6px 6px 0 0;background:color-mix(in srgb,var(--c) 35%,transparent)}
.vb .c.on i{background:var(--c)}
.vb .c small{font-size:10px;color:var(--mut);margin-top:5px}
.vb .c em{font-style:normal;font-size:10px;font-weight:600;margin-bottom:3px;white-space:nowrap}
.hb .r{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center;margin-bottom:9px;font-size:12px}
.hb .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .r span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.hb .t{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--c);border-radius:99px}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:var(--a1);border-color:var(--a1);color:#fff}
.unote{color:var(--mut);font-size:12px;margin:-4px 2px 12px;min-height:0}
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.prow:active{transform:scale(.99)}
.prow .av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--a1) 16%,transparent);color:var(--a1);font-weight:700;font-size:14px}
.prow .nm{flex:1;min-width:0}.prow .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prow .nm small{color:var(--mut);font-size:12px}
.prow .bl{text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}.prow .bl small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.bl.up{color:#c0392b}.bl.dn{color:#2f8f5b}
:root{--a4:#7c5cbf}@media (prefers-color-scheme:dark){:root{--a4:#a98be8}}
.subh2{margin:14px 0 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.dl{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.dl span:first-child{color:var(--mut)}.dl b{font-variant-numeric:tabular-nums}
.msgbox{width:100%;min-height:150px;margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
a.pbt{text-align:center;text-decoration:none}
.al{display:flex;align-items:flex-start;gap:8px}.al .alt{flex:1;min-width:0}.al .alx{flex:none;border:0;background:none;color:var(--mut);font:inherit;font-size:16px;line-height:1;width:28px;height:28px;margin:-5px -7px -5px 0;border-radius:50%;cursor:pointer}.al .alx:active{background:var(--line)}
.telr{display:flex;gap:8px;align-items:center}.telr input{flex:1;min-width:0}.telr button{flex:none;width:auto;margin:0;padding:12px 12px;font-size:14px}
#app{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
#app.on{display:flex;z-index:20}
#bar{flex:none;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;background:var(--card);border-bottom:1px solid var(--line)}
#bar button{background:none;border:0;color:var(--ink);font:inherit;font-size:15px;padding:6px 8px;cursor:pointer}
#frame{flex:1;border:0;width:100%;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media print{#gear,#quick,.back,#alerts,.chips,#usr,.pbt,.card,#goU,#app{display:none!important}body{background:#fff!important;color:#000}.wrap{max-width:none}}
</style>
</head>
<body>

  <button class="card" data-app="veresiye" style="--c:var(--a2)"><div class="ic">📒</div><div><b>Veresiye Defteri</b><span class="d">Müşteri borç ve ödeme takibi</span></div><span class="arr">›</span></button>

  <button class="card" data-app="yem" style="--c:var(--a3)"><div class="ic">🌾</div><div><b>Yem Takip</b><span class="d">Yem alım, depo ve çıkış takibi</span></div><span class="arr">›</span></button>

<script>
/* Bildirim satırı: sağında ✕ var, kapatılan bildirim o gün tekrar görünmez. */
var HSP_KAPALI='hsp.kapaliBildirim';
function hspGun(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function hspKapalilar(){try{return JSON.parse(localStorage.getItem(HSP_KAPALI)||'{}')||{}}catch(e){return {}}}
function hspAl(metin,tikla,kalici){
  var k=hspKapalilar(),v=k[metin];if(v==='kalici'||v===hspGun())return null;
  var d=document.createElement('div');d.className='al';
  var t=document.createElement('span');t.className='alt';t.textContent=metin;d.appendChild(t);
  if(tikla)t.onclick=tikla;
  var x=document.createElement('button');x.className='alx';x.type='button';x.setAttribute('aria-label','Bildirimi kapat');x.textContent='✕';
  x.onclick=function(e){e.stopPropagation();var k=hspKapalilar(),g=hspGun();Object.keys(k).forEach(function(a){if(k[a]!=='kalici'&&k[a]!==g)delete k[a]});k[metin]=kalici?'kalici':g;try{localStorage.setItem(HSP_KAPALI,JSON.stringify(k))}catch(e2){}
    var p=d.parentNode;d.remove();if(p&&!p.childNodes.length)p.hidden=true};
  d.appendChild(x);return d;
}
/* Soldan sağa kaydırınca geri git. Yatay kaydırılan alanlar, form alanları ve kendi kaydırma hareketi olan satırlar hariç. */
function hspKaydirGeri(doc,geri){
  var sx=0,sy=0,ok=false;
  function atla(t){
    var w=doc.defaultView;
    for(var e=t;e&&e.nodeType===1;e=e.parentNode){
      if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.tagName)||e.isContentEditable)return true;
      if(e.matches&&e.matches('.item[data-id]'))return true;
      if(e.scrollLeft>0){var o=w.getComputedStyle(e).overflowX;if(o==='auto'||o==='scroll')return true}
    }
    return false;
  }
  doc.addEventListener('touchstart',function(e){ok=false;if(e.touches.length!==1)return;var t=e.touches[0];sx=t.clientX;sy=t.clientY;ok=!atla(e.target)},{passive:true});
  doc.addEventListener('touchmove',function(e){if(ok&&e.touches.length!==1)ok=false},{passive:true});
  doc.addEventListener('touchcancel',function(){ok=false},{passive:true});
  doc.addEventListener('touchend',function(e){if(!ok)return;ok=false;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(dx>80&&Math.abs(dy)<dx*0.6)geri()},{passive:true});
}

(.2,.8,.2,1) backwards}\n.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}\n.dname{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}\n.dq{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}\n.dq small{color:var(--mu);font-weight:500}\n.dm{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:8px}\n.wk{display:flex;align-items:flex-end;gap:8px;height:130px;margin:10px 0 6px}\n.wc{flex:1;height:100%;display:flex;flex-direction:column;align-items:center}\n.wb{flex:1;width:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center;gap:3px}\n.bb,.bs{width:40%;border-radius:6px 6px 2px 2px;min-height:2px;transition:height .6s cubic-bezier(.2,.8,.2,1)}\n.bb{background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 60%,transparent))}\n.bs{background:linear-gradient(180deg,var(--ok),color-mix(in srgb,var(--ok) 60%,transparent))}\n.wc small{font-size:10px;color:var(--mu);margin-top:4px}\n.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);justify-content:center;margin-bottom:12px}\n.lg span{display:flex;align-items:center;gap:6px}\n.tl{display:grid}\n.ti{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}\n.ti:last-child{border-bottom:0}\n.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap}\n.tm{min-width:0}\n.tn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.td{font-size:12px;color:var(--mu);margin-top:2px}\n.ta{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}\n.ta b{display:block;font-size:14px}\n.ta b small{color:var(--mu);font-weight:400}\n.ta span{font-size:12px;color:var(--mu)}\n</style>\n</head>\n<body>\n<h1>Yem Takip</h1>\n<div class=\"mu\">Fabrika alımları, depo ve satış takibi · Kayıtlar buluta eşitlenir</div>\n<select id=\"mon\"></select>\n\n<div class=\"card\"><div class=\"stats\" id=\"stats\"></div></div>\n\n<div class=\"card\">\n  <h2>Ay sonu özeti</h2>\n  <div class=\"scroll\"><table id=\"sum\"></table></div>\n  <h2 style=\"margin-top:14px\">Fabrika alımları</h2><div class=\"scroll\"><table id=\"alimT\"></table></div><h2 style=\"margin-top:14px\">Depodaki yemler</h2><div class=\"scroll\"><table id=\"depoT\"></table></div><div class=\"tb\"><button id=\"cp\">Özeti Excel için kopyala</button></div><div class=\"hint\">Kâr, satılan yemin cirosundan maliyetin düşülmesiyle bulunur. Maliyet ilk giren ilk çıkar mantığıyla hesaplanır. \"Depoda şu an\" sütunu tüm zamanların güncel stoğudur.</div>\n</div>\n\n<div class=\"card\">\n  <h2>Yeni kayıt</h2>\n  <div class=\"seg\">\n    <button data-m=\"alim\">Alım</button>\n    \n    <button data-m=\"cekim\">Fabrika çekimi</button>\n    <button data-m=\"giris\">Depo girişi</button>\n    <button data-m=\"cikis\">Depo çıkışı</button>\n  </div>\n  <div class=\"form\" id=\"form\"></div>\n  <div id=\"msg\"></div></div><div class=\"card\"><h2>Depo durumu</h2><div id=\"depo2\"></div><h2 style=\"margin-top:14px\">Son işlemler</h2><div id=\"last\"></div>\n</div>\n\n<div class=\"card\">\n  <h2>Fabrikadan alacağım yemler</h2><div class=\"scroll\"><table id=\"alacak\"></table></div></div><div class=\"card\"><h2>Kayıtlar</h2>\n  <div class=\"scroll\"><table id=\"log\"></table></div>\n</div>\n\n<script>\nconst K='yem-v5', TR='tr-TR', $=i=>document.getElementById(i);\nconst today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};\nlet D={alim:[],cekim:[],giris:[],cikis:[]};\ntry{D=Object.assign(D,JSON.parse(localStorage.getItem(K))||{})}catch(e){}\nlet mode='alim', month=today().slice(0,7);\nconst T={alim:'Alım',cekim:'Fabrika çekimi',giris:'Depo girişi',cikis:'Depo çıkışı'};\nconst r2=n=>Math.round((n||0)*100)/100;\nconst tl=n=>r2(n).toLocaleString(TR,{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';\nconst num=n=>(+n||0).toLocaleString(TR,{maximumFractionDigits:2});\nconst esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst pn=s=>{let v=String(s??'').trim().replace(/[₺\\s]/g,'');if(/^\\d{1,3}(\\.\\d{3})+$/.test(v))v=v.replace(/\\./g,'');else v=v.replace(',','.');const n=parseFloat(v);return isFinite(n)?n:NaN};\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);\nconst byDate=(a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.id).localeCompare(String(b.id));\nconst ucost=l=>Math.max(0,l.list-l.disc);\nconst lotRem=l=>l.qty-D.cekim.filter(c=>c.lot===l.id).reduce((s,c)=>s+c.qty,0);\nconst inM=d=>month==='all'||(d||'').slice(0,7)===month;\nconst msg=(t,err)=>{const e=$('msg');e.textContent=t;e.style.color=err?'var(--bad)':'var(--ok)'};\n\n/* Depo partileri ve FIFO hesabı: her satış, tarihi uygun en eski partiden düşer */\nfunction calc(){\n  const B=[], over={};\n  D.cekim.forEach(c=>{const l=D.alim.find(x=>x.id===c.lot);if(!l)return;over[l.id]=(over[l.id]||0)+c.qty;B.push({id:c.id,date:c.date,name:l.name,qty:c.qty,cost:ucost(l)})});\n  D.giris.forEach(g=>B.push({id:g.id,date:g.date,name:g.name,qty:g.qty,cost:g.cost}));\n  B.forEach(b=>b.rem=b.qty);\n  B.sort(byDate);\n  let bad=D.alim.some(l=>(over[l.id]||0)>l.qty+1e-9);\n  const sale={};\n  D.cikis.slice().sort(byDate).forEach(s=>{\n    let need=s.qty,cogs=0;\n    for(const b of B){\n      if(need<=1e-9)break;\n      if(b.name!==s.name||b.date>s.date||b.rem<=1e-9)continue;\n      const t=Math.min(b.rem,need);b.rem-=t;need-=t;cogs+=t*b.cost;\n    }\n    if(need>1e-9)bad=true;\n    sale[s.id]=r2(cogs);\n  });\n  return {B,sale,bad};\n}\n/* Kayıt, stok kurallarını bozuyorsa geri alınır */\nfunction tryCommit(fn){\n  const bak=JSON.stringify(D);\n  fn();\n  if(calc().bad){D=JSON.parse(bak);return false}\n  try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}syncAll();\n  return true;\n}\n\nfunction renderMonths(){\n  const all=[...D.alim.map(l=>l.date),...D.cekim.map(c=>c.date),...D.giris.map(x=>x.date),...D.cikis.map(s=>s.date),today()];\n  const ms=[...new Set(all.map(d=>(d||'').slice(0,7)).filter(Boolean))].sort().reverse();\n  const label=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleString(TR,{month:'long',year:'numeric'})};\n  $('mon').innerHTML='<option value=\"all\">Tüm zamanlar</option>'+ms.map(m=>`<option value=\"${m}\">${esc(label(m))}</option>`).join('');\n  if(month!=='all'&&!ms.includes(month))month='all';\n  $('mon').value=month;\n}\n\nfunction render(){\n  const {B,sale}=calc(),G={};\n  const g=n=>G[n]||(G[n]={n,alim:0,pay:0,dep:0,sold:0,rev:0,cogs:0,rem:0,remv:0});\n  D.alim.filter(l=>inM(l.date)).forEach(l=>{const x=g(l.name);x.alim+=l.qty;x.pay+=l.qty*ucost(l)});\n  D.cekim.filter(c=>inM(c.date)).forEach(c=>{const l=D.alim.find(a=>a.id===c.lot);if(l)g(l.name).dep+=c.qty});\n  D.giris.filter(x=>inM(x.date)).forEach(x=>g(x.name).dep+=x.qty);\n  D.cikis.filter(s=>inM(s.date)).forEach(s=>{const x=g(s.name);x.sold+=s.qty;x.rev+=s.qty*s.price;x.cogs+=sale[s.id]||0});\n  B.forEach(b=>{if(b.rem>1e-9){const x=g(b.name);x.rem+=b.rem;x.remv+=b.rem*b.cost}});\n  const rows=Object.values(G).sort((a,b)=>a.n.localeCompare(b.n,TR));\n  const t=rows.reduce((o,r)=>{for(const k of['alim','pay','dep','sold','rev','cogs','remv'])o[k]+=r[k];return o},{alim:0,pay:0,dep:0,sold:0,rev:0,cogs:0,remv:0});\n  const kar=t.rev-t.cogs, depoNow=B.reduce((s,b)=>s+Math.max(0,b.rem),0);\n  const pal=['#1f6feb','#2da44e','#d4a72c','#8250df','#e16f24','#0ea5a4'];\n  const donut=(items,tot)=>{let a=0;const seg=items.map((r,i)=>{const s=a,e=a+(tot>0?r.v/tot*100:0);a=e;return `${pal[i%pal.length]} ${s.toFixed(2)}% ${e.toFixed(2)}%`}).join(',');return `<div class=\"dn\"><div class=\"ring\" style=\"--s:${Math.round(Math.min(132,Math.max(72,56+24*Math.log10(tot+1))))}px;background:conic-gradient(${seg||'var(--bd) 0 100%'})\"><div class=\"hole\"><strong>${num(tot)}</strong><small>çuval</small></div></div></div>`};\n  const brk=items=>{const tot=items.reduce((s,r)=>s+r.v,0);return items.length?`${donut(items,tot)}<div class=\"bk\">${items.map((r,i)=>`<div><div class=\"bi\"><em><i class=\"dot\" style=\"background:${pal[i%pal.length]}\"></i>${esc(r.n)}</em><b>${num(r.v)}</b></div><div class=\"bar\"><div style=\"width:${tot>0?(r.v/tot*100).toFixed(1):0}%;background:${pal[i%pal.length]}\"></div></div></div>`).join('')}</div>`:''};\n  const tdy=today(),tdA=D.alim.filter(l=>l.date===tdy),tdQ=tdA.reduce((s,l)=>s+l.qty,0),tdP=tdA.reduce((s,l)=>s+l.qty*ucost(l),0),tdL=new Date().toLocaleDateString(TR);\n  const karPct=t.rev>0?Math.max(0,Math.min(100,kar/t.rev*100)):0;\n  $('stats').innerHTML=[\n    ['Alınan çuval',num(t.alim),brk(rows.filter(r=>r.alim>0).map(r=>({n:r.n,v:r.alim})))],\n    ['Depoda şu an',num(depoNow)+' <small>çuval</small>',brk(rows.filter(r=>r.rem>1e-9).map(r=>({n:r.n,v:r.rem})))],\n    ['Finans özeti','',`<div class=\"fr\"><em>Ödenen tutar</em><strong>${tl(t.pay)}</strong></div><div class=\"fr\"><em>Ciro</em><strong>${tl(t.rev)}</strong></div><div class=\"fr\"><em>Kâr</em><strong class=\"${kar>=0?'ok':'bad'}\">${tl(kar)}</strong><div class=\"bar\"><div style=\"width:${karPct.toFixed(1)}%;background:var(--ok)\"></div></div><div class=\"sub\">Cironun %${karPct.toFixed(0)}'si</div></div><div class=\"fr\"><em>Bugün fabrikadan alınan · ${tdL}</em><strong>${num(tdQ)} <small>çuval</small></strong><div class=\"sub\">${tdQ>0?tl(tdP)+' tutarında':'Bugün mal alınmadı'}</div></div>`],\n    ['Satılan çuval',num(t.sold),brk(rows.filter(r=>r.sold>0).map(r=>({n:r.n,v:r.sold})))]\n  ].map(([a,b,c])=>`<div class=\"stat\"><span>${a}</span><b>${b}</b>${c}</div>`).join('');\n  const head='<thead><tr><th>Yem</th><th class=\"n\">Alınan</th><th class=\"n\">Ödenen</th><th class=\"n\">Depoya giren</th><th class=\"n\">Satılan</th><th class=\"n\">Ciro</th><th class=\"n\">Maliyet</th><th class=\"n\">Kâr</th><th class=\"n\">Depoda şu an</th></tr></thead>';\n  renderDetail(B);\n  renderAlacak();\n  renderStockV2(B);\n  $('sum').innerHTML=head+'<tbody>'+(rows.length?rows.map(r=>{const k=r.rev-r.cogs;return `<tr><td>${esc(r.n)}</td><td class=\"n\">${num(r.alim)}</td><td class=\"n\">${tl(r.pay)}</td><td class=\"n\">${num(r.dep)}</td><td class=\"n\">${num(r.sold)}</td><td class=\"n\">${tl(r.rev)}</td><td class=\"n\">${tl(r.cogs)}</td><td class=\"n ${k>=0?'ok':'bad'}\">${tl(k)}</td><td class=\"n\">${num(r.rem)} <span class=\"mu\">(${tl(r.remv)})</span></td></tr>`}).join('')+`<tr class=\"tot\"><td>Toplam</td><td class=\"n\">${num(t.alim)}</td><td class=\"n\">${tl(t.pay)}</td><td class=\"n\">${num(t.dep)}</td><td class=\"n\">${num(t.sold)}</td><td class=\"n\">${tl(t.rev)}</td><td class=\"n\">${tl(t.cogs)}</td><td class=\"n ${kar>=0?'ok':'bad'}\">${tl(kar)}</td><td class=\"n\">${num(depoNow)} çuval</td></tr>`:'<tr><td colspan=\"9\" class=\"empty\">Bu dönemde kayıt yok</td></tr>')+'</tbody>';\n}\n\nfunction renderDetail(B){\n  const grp={};\n  D.alim.slice().sort(byDate).forEach(l=>{const x=grp[l.name]||(grp[l.name]={n:l.name,date:'',q:0,pay:0,c:0});x.q+=l.qty;x.pay+=l.qty*ucost(l);x.date=l.date;x.c+=D.cekim.filter(y=>y.lot===l.id).reduce((s,y)=>s+y.qty,0)});\n  const alimT=Object.values(grp).sort((a,b)=>a.n.localeCompare(b.n,TR)).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.n)}</td><td class=\"n\">${num(x.q)}</td><td class=\"n\">${tl(x.q?x.pay/x.q:0)}</td><td class=\"n\"><b>${tl(x.pay)}</b></td><td class=\"n\">${num(x.c)}</td><td class=\"n ${x.q-x.c>0?'ok':''}\">${num(x.q-x.c)}</td></tr>`).join('');\n  $('alimT').innerHTML='<thead><tr><th>Son alım</th><th>Yem</th><th class=\"n\">Alınan</th><th class=\"n\">Ort. birim</th><th class=\"n\">Ödenen</th><th class=\"n\">Çekilen</th><th class=\"n\">Fabrikada kalan</th></tr></thead><tbody>'+(alimT||'<tr><td colspan=\"7\" class=\"empty\">Alım yok</td></tr>')+'</tbody>';\n  const depoT=B.filter(b=>b.rem>1e-9).sort(byDate).map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.name)}</td><td class=\"n\"><b>${num(b.rem)}</b></td><td class=\"n\">${tl(b.cost)}</td><td class=\"n\">${tl(b.rem*b.cost)}</td></tr>`).join('');\n  $('depoT').innerHTML='<thead><tr><th>Giriş tarihi</th><th>Yem</th><th class=\"n\">Depoda</th><th class=\"n\">Birim maliyet</th><th class=\"n\">Değer</th></tr></thead><tbody>'+(depoT||'<tr><td colspan=\"5\" class=\"empty\">Depo boş</td></tr>')+'</tbody>';\n}\nfunction renderAlacak(){\n  const G={};\n  D.alim.forEach(l=>{const x=G[l.name]||(G[l.name]={n:l.name,q:0,c:0,v:0});const k=Math.max(0,lotRem(l));x.q+=l.qty;x.c+=l.qty-k;x.v+=k*ucost(l)});\n  const rows=Object.values(G).filter(x=>x.q-x.c>1e-9).sort((a,b)=>a.n.localeCompare(b.n,TR));\n  const tot=rows.reduce((s,r)=>s+r.v,0);\n  $('alacak').innerHTML='<thead><tr><th>Yem</th><th class=\"n\">Alınan</th><th class=\"n\">Çekilen</th><th class=\"n\">Alacağım</th><th class=\"n\">Değer</th></tr></thead><tbody>'+(rows.length?rows.map(r=>`<tr><td>${esc(r.n)}</td><td class=\"n\">${num(r.q)}</td><td class=\"n\">${num(r.c)}</td><td class=\"n\"><b>${num(r.q-r.c)} çuval</b></td><td class=\"n\">${tl(r.v)}</td></tr>`).join('')+`<tr class=\"tot\"><td>Toplam</td><td></td><td></td><td></td><td class=\"n\">${tl(tot)}</td></tr>`:'<tr><td colspan=\"5\" class=\"empty\">Fabrikadan alacağın yem yok</td></tr>')+'</tbody>';\n}\nfunction renderStock(B){\n  const dep=B.filter(b=>b.rem>1e-9).sort(byDate).map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.date)}</td><td class=\"n\"><b>${num(b.rem)} çuval</b></td><td class=\"n\">${tl(b.rem*b.cost)}</td></tr>`).join('');\n  $('depo2').innerHTML='<thead><tr><th>Yem</th><th>Giriş</th><th class=\"n\">Depoda</th><th class=\"n\">Değer</th></tr></thead><tbody>'+(dep||'<tr><td colspan=\"4\" class=\"empty\">Depo boş</td></tr>')+'</tbody>';\n  const ev=[];\n  D.alim.forEach(l=>ev.push({d:l.date,t:'Alım',n:l.name,q:l.qty,a:l.qty*ucost(l)}));\n  D.cekim.forEach(c=>{const l=D.alim.find(a=>a.id===c.lot);if(l)ev.push({d:c.date,t:'Fabrika çekimi     var veri=JSON.stringify({tam:true,surum:2,tarih:new Date().toISOString(),veresiye:VR,sut:S,yem:Y,ilac:{fiyat:nvA.ilacFiyat,hareket:nvA.ilacHareket},ayar:{tel:nvA.tel,prices:nvA.prices,giderler:nvA.giderler,notlar:nvA.notlar}});
    return nvSifrele(veri,pw).then(function(sf){return JSON.stringify(sf)});
  }
  function nvYedekKayitlari(d){
    if(!DBH)return Promise.resolve();
    var isler=[];
    function yaz(kol,x){if(!x)return;var id=x.id||('y'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));x.id=id;isler.push(DBH.collection(kol).doc(id).set(x))}
    nvDizi(d.sut&&d.sut.milk).forEach(function(x){yaz('milk',x)});
    nvDizi(d.sut&&d.sut.pay).forEach(function(x){yaz('pay',x)});
    nvDizi(d.yem&&d.yem.alim).forEach(function(x){yaz('yem-alim',x)});
    nvDizi(d.yem&&d.yem.cekim).forEach(function(x){yaz('yem-cekim',x)});
    nvDizi(d.yem&&d.yem.giris).forEach(function(x){yaz('yem-giris',x)});
    nvDizi(d.yem&&d.yem.cikis).forEach(function(x){yaz('yem-cikis',x)});
    if(d.veresiye&&nvA.id)isler.push(DBH.collection('data/users/'+nvA.id).doc('defter').set({data:JSON.stringify(d.veresiye)}));
    return Promise.all(isler);
  }
  function nvYedekYukle(metin,pw){
    return Promise.resolve().then(function(){
      var obj=JSON.parse(metin),plain=metin;
      if(obj&&obj.v===1&&obj.data){return nvCoz(obj,pw).catch(function(){throw new Error('Şifre yanlış ya da yedek bozuk')})}
      return plain;
    }).then(function(plain){
      var d=JSON.parse(plain);
      if(!d||!d.sut||!d.yem)throw new Error('Bu bir Hesaplar yedeği değil');
      if(d.ilac){nvA.ilacFiyat=d.ilac.fiyat||{};nvA.ilacHareket=nvBirlestir(nvA.ilacHareket,d.ilac.hareket)}
      if(d.ayar){nvA.tel=Object.assign({},nvA.tel,d.ayar.tel||{});nvA.prices=Object.assign({},nvA.prices,d.ayar.prices||{});nvA.giderler=nvBirlestir(nvA.giderler,d.ayar.giderler);nvA.notlar=nvBirlestir(nvA.notlar,d.ayar.notlar)}
      return nvYedekKayitlari(d).then(function(){return nvAyarKaydet()}).then(function(){nvHepsi();return DBH?'tam':'kısmi'});
    });
  }
  function nvYedekAc(){
    var b=el('div');
    var msg=el('div','msg');
    var stil='width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit';
    b.appendChild(el('b',null,'Yedek al'));
    var pw=el('input');pw.type='password';pw.placeholder='Yedek şifresi (en az 6 karakter)';pw.style.cssText=stil+';margin:6px 0';
    b.appendChild(pw);
    var out=el('textarea');out.rows=4;out.readOnly=true;out.placeholder='Oluşturulan yedek burada çıkar';out.style.cssText=stil+';font:12px monospace';
    b.appendChild(out);
    var sira=el('div',null);sira.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin:8px 0';
    sira.appendChild(btn('Yedeği oluştur','',function(){
      if(pw.value.length<6){nvMesaj(msg,'Şifre en az 6 karakter olmalı',false);return}
      nvMesaj(msg,'Yedek hazırlanıyor…',true);
      nvYedekMetin(pw.value).then(function(t){out.value=t;nvMesaj(msg,'Yedek hazır: '+nvYedekOzet()+((DBH&&nvA.id)?'':' ⚠ Claude hesabına giriş yapılmadığı için süt, yem ve veresiye kayıtları yedeğe girmedi.'),(DBH&&nvA.id)?true:false)}).catch(function(){nvMesaj(msg,'Yedek oluşturulamadı',false)});
    }));
    sira.appendChild(btn('Dosya olarak kaydet','alt',function(){nvYedekIndir(out.value,msg)}));
    sira.appendChild(btn('Kopyala','alt',function(){
      if(!out.value){nvMesaj(msg,'Önce yedeği oluştur',false);return}
      out.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}
      nvMesaj(msg,ok?'Kopyalandı':'Metin seçildi, kopyalayabilirsin',true);
    }));
    b.appendChild(sira);
    b.appendChild(el('b',null,'Geri yükle'));
    var ta=el('textarea');ta.rows=4;ta.placeholder='Yedek metnini buraya yapıştır';ta.style.cssText=stil;ta.style.marginTop='6px';
    b.appendChild(ta);
    var fi=el('input');fi.type='file';fi.accept='.json,application/json';fi.style.cssText='margin:6px 0;width:100%';
    fi.onchange=function(){var f=fi.files&&fi.files[0];if(!f)return;var r=new FileReader();r.onload=function(){ta.value=r.result;nvMesaj(msg,'Dosya yüklendi. Şifreyi gir ve geri yükle.',true)};r.readAsText(f)};
    b.appendChild(fi);
    var bekle=0;
    var gy=btn('Geri yükle (birleştir)','alt',function(){
      if(!ta.value.trim()){nvMesaj(msg,'Önce yedek metnini yapıştır ya da dosya seç',false);return}
      if(pw.value.length<6){nvMesaj(msg,'Yedek şifresini gir',false);return}
      if(bekle===0){
        bekle=1;gy.textContent='Emin misin? Tekrar dokun';
        nvMesaj(msg,'Yedekteki kayıtlar mevcut verilere eklenecek. Onaylamak için tekrar dokun.',true);
        setTimeout(function(){bekle=0;gy.textContent='Geri yükle (birleştir)'},6000);
        return;
      }
      bekle=0;gy.textContent='Geri yükle (birleştir)';
      nvMesaj(msg,'Geri yükleniyor…',true);
      nvYedekYukle(ta.value.trim(),pw.value).then(function(durum){
        nvMesaj(msg,durum==='tam'?'Yedek geri yüklendi ✓':'Ayarlar geri yüklendi ✓ (kayıtlar için Claude hesabına giriş yap)',true);
      }).catch(function(e){nvMesaj(msg,(e&&e.message)||'Geri yükleme başarısız',false)});
    });
    gy.style.marginTop='8px';
    b.appendChild(gy);
    b.appendChild(msg);
    sheet('Yedek ve geri yükleme',b);
  }
  function nvYedekGonder(metin,msg){
    if(!metin){nvMesaj(msg,'Önce yedeği oluştur',false);return}
    if(!navigator.share){nvMesaj(msg,'Bu ortam paylaşımı desteklemiyor (navigator.share yok). Kopyala ile devam et.',false);return}
    var ad='hesaplar-yedek-'+ds(new Date())+'.enc.json';
    var veri={title:'Hesaplar yedeği',text:metin};
    try{
      var dosya=new File([metin],ad,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[dosya]}))veri={title:'Hesaplar yedeği',files:[dosya]};
    }catch(e){}
    navigator.share(veri).then(function(){nvMesaj(msg,'Paylaşıldı ✓',true)}).catch(function(e){
      if(e&&e.name==='AbortError')return;
      nvMesaj(msg,'Paylaşım hatası: '+(e&&e.name?e.name:'?')+' · '+(e&&e.message?e.message:'') + ' (Kopyala ile devam edebilirsin)',false);
    });
  }
  function nvYedekIndir(metin,msg){
    if(!metin){nvMesaj(msg,'Önce yedeği oluştur',false);return}
    var ad='hesaplar-yedek-'+ds(new Date())+'.enc.json';
    if(!CL){nvMesaj(msg,'Dosya kaydetme bu ortamda yok. Kopyala ile devam et.',false);return}
    CL.use('downloads').then(function(D){
      if(!D){nvMesaj(msg,'Dosya kaydetme bu ortamda kapalı. Kopyala ile devam et.',false);return}
      return D.save({filename:ad,data:metin}).then(function(){nvMesaj(msg,'Dosya kaydedildi ✓',true)});
    }).catch(function(e){
      if(e&&e.code==='declined')return;
      nvMesaj(msg,'Dosya kaydedilemedi: '+((e&&e.message)||'bilinmeyen hata')+'. Kopyala ile devam et.',false);
    });
  }
  function nvYedekOzet(){
    var y=Y||{},ay=Object.keys((VR&&VR.months)||{}).length;
    return [
      nvDizi(S&&S.milk).length+' süt',
      nvDizi(S&&S.pay).length+' ödeme',
      ay+' veresiye ayı',
      nvDizi(y.alim).length+' alım',
      nvDizi(y.cekim).length+' çekim',
      nvDizi(y.giris).length+' giriş',
      nvDizi(y.cikis).length+' çıkış',
      nvDizi(nvA.ilacHareket).length+' ilaç hareketi',
      nvDizi(nvA.giderler).length+' gider',
      nvDizi(nvA.notlar).length+' not'
    ].join(' · ');
  }
  function nvYazdirIframe(h){
    var f=document.createElement('iframe');
    f.style.cssText='position:fixed;left:-10000px;top:0;width:900px;height:1200px;border:0';
    document.body.appendChild(f);
    var d=f.contentWindow.document;d.open();d.write(h);d.close();
    setTimeout(function(){
      try{f.contentWindow.focus();f.contentWindow.print()}
      catch(e){
        var pw=window.open('','_blank');
        if(pw){pw.document.write(h);pw.document.close();pw.focus();setTimeout(function(){pw.print()},400)}
        else nvToast('Yazdırma açılamadı. PDF ile kaydet düğmesini kullan.');
      }
      setTimeout(function(){f.remove()},60000);
    },400);
  }
  var nvPoll=setInterval(function(){if(DBH&&CL){clearInterval(nvPoll);nvAyarYukle()}},500);
  nvHepsi();
  document.querySelectorAll('[data-app]').forEach(function(b){b.onclick=function(){openApp(b.dataset.app)}});
  document.getElementById('close').onclick=closeApp;
  hspKaydirGeri(document,function(){
    if(!$('lock').hidden)return;
    if(!$('sheet').hidden){$('sheet').hidden=true;return}
    if(app.classList.contains('on')){closeApp();return}
    var h=location.hash;
    if(h==='#ureticiler'||h==='#notlar')location.hash='hesaplar';
    else if(h!=='#ana')location.hash='ana';
  });
})();
</script>
